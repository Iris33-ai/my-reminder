<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fc"><title>我的提醒</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#172033;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:24px 18px 48px}.hero{padding:18px 2px 20px}.eyebrow{color:#6b7280;font-size:14px}.hero h1{font-size:34px;margin:6px 0}.hero p{color:#6b7280;margin:0}.card{background:white;border:1px solid #e7eaf0;border-radius:22px;padding:18px;box-shadow:0 8px 26px #27334d0c}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;color:#667085}.field input{border:1px solid #dfe3ea;border-radius:13px;padding:13px;font-size:16px;background:#fbfcfe}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.button{border:0;border-radius:13px;padding:14px;background:#4f46e5;color:white;font-size:16px;font-weight:700}.list{display:grid;gap:12px;margin-top:18px}.empty{text-align:center;color:#8a93a3;padding:25px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 16px;border:1px solid #e7eaf0;background:white;border-radius:17px}.item.done{opacity:.55}.title{font-weight:700}.time{font-size:13px;color:#6b7280;margin-top:5px}.actions{display:flex;gap:7px}.small{border:1px solid #dfe3ea;background:#fff;border-radius:10px;padding:8px 10px;color:#4b5563}.count{color:#4f46e5;font-size:13px;font-weight:600;margin-top:4px}.tip{font-size:13px;color:#737b8c;margin-top:14px;line-height:1.5}@media(max-width:420px){.row{grid-template-columns:1fr}.hero h1{font-size:30px}}
</style></head><body><main><section class="hero"><div class="eyebrow">简单、清楚、随时查看</div><h1>我的提醒</h1><p>把重要的事记下来，给未来的自己一个提示。</p></section><section class="card"><form id="form" class="form"><div class="field"><label for="title">提醒内容</label><input id="title" required placeholder="例如：交电费、给妈妈打电话"></div><div class="row"><div class="field"><label for="date">日期</label><input id="date" type="date" required></div><div class="field"><label for="time">时间</label><input id="time" type="time" required></div></div><button class="button">保存提醒</button></form><div class="tip">提示：先允许 Safari 发送通知，并把网页添加到主屏幕，提醒体验会更好。</div></section><section id="list" class="list"></section></main><script>
const $=s=>document.querySelector(s), key='my-reminders-v1';let items=JSON.parse(localStorage.getItem(key)||'[]');const now=new Date(), pad=n=>String(n).padStart(2,'0');$('#date').value=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;$('#time').value=`${pad(now.getHours())}:${pad(now.getMinutes()+5)}`;
function save(){localStorage.setItem(key,JSON.stringify(items))}function fmt(x){return new Date(x).toLocaleString('zh-CN',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}function render(){const list=$('#list');if(!items.length){list.innerHTML='<div class="empty">还没有提醒，先添加一条吧。</div>';return}items.sort((a,b)=>a.at-b.at);list.innerHTML=items.map(x=>`<article class="item ${x.done?'done':''}"><div><div class="title">${x.title.replaceAll('<','&lt;')}</div><div class="time">${fmt(x.at)}</div>${!x.done?`<div class="count">${new Date(x.at)>new Date()? '即将提醒':'已到时间'}</div>`:''}</div><div class="actions"><button class="small" onclick="toggle('${x.id}')">${x.done?'恢复':'完成'}</button><button class="small" onclick="removeItem('${x.id}')">删除</button></div></article>`).join('')}function toggle(id){const x=items.find(i=>i.id===id);x.done=!x.done;save();render()}function removeItem(id){items=items.filter(i=>i.id!==id);save();render()}$('#form').addEventListener('submit',e=>{e.preventDefault();const at=new Date(`${$('#date').value}T${$('#time').value}`).getTime();items.push({id:crypto.randomUUID(),title:$('#title').value.trim(),at,done:false});save();$('#title').value='';render()});render();setInterval(render,60000);
</script></body></html>
